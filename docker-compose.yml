version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: ${DB_CONTAINER_NAME:-darkcopy-db}
    restart: unless-stopped
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME:-darkcopy-backend}
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_READ_URL: ${DATABASE_READ_URL:-}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    container_name: ${FRONTEND_CONTAINER_NAME:-darkcopy-frontend}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:8080
      NODE_ENV: production

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-darkcopy-redis}
    restart: unless-stopped
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-backup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: ${DB_BACKUP_CONTAINER_NAME:-darkcopy-db-backup}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PORT: 5432
      SCHEDULE: "@daily"
      BACKUP_KEEP_MINS: 0
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 0
      BACKUP_KEEP_MONTHS: 0
    volumes:
      - db_backups:/var/opt/pgbackups

volumes:
  postgres_data:
  uploads_data:
  db_backups:
