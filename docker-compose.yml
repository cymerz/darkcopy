version: "3.8"

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: darkcopy-db
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-example_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-example_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Go API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darkcopy-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Only vars needing Docker service hostname substitution go here.
      # All other config (ADMIN_TOKEN, S3_*, S3_PROVIDERS, UPLOAD_*, etc.)
      # is passed through via env_file above, supporting dynamic multi-S3
      # provider prefixes (e.g. S3_BACKBLAZE_BUCKET, S3_CLOUDFLARE_BUCKET).
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-example_user}:${POSTGRES_PASSWORD:-example_password_change_me}@db:5432/${POSTGRES_DB:-example_db}?sslmode=disable
      DATABASE_READ_URL: ${DATABASE_READ_URL:-postgres://example_user:example_password_change_me@db:5432/example_db?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - uploads_data:/app/uploads

  # 3. Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    container_name: darkcopy-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend
    environment:
      PORT: 3000
      BACKEND_URL: http://backend:8080 # Next.js rewrites proxy endpoint
      NODE_ENV: production

  # 4. Redis Service
  redis:
    image: redis:7-alpine
    container_name: darkcopy-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. PostgreSQL Backup Service (pg_dump sidecar)
  db-backup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: darkcopy-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-example_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-example_db}
      POSTGRES_PORT: 5432
      SCHEDULE: "@daily"
      BACKUP_KEEP_MINS: 0
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 0
      BACKUP_KEEP_MONTHS: 0
    volumes:
      - db_backups:/var/opt/pgbackups

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  db_backups:
    driver: local